services:
  postgres:
    image: postgres:17-alpine
    container_name: applygrid-db

    restart: unless-stopped

    env_file:
      - ./server/.env.production

    volumes:
      - /srv/storage/postgres/applygrid/data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./server

    env_file:
      - ./server/.env.production

    container_name: applygrid-server

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./client
      args:
        - NEXT_PUBLIC_API_URL=/api

    container_name: applygrid-client

    restart: unless-stopped

    depends_on:
      - backend

    environment:
      NEXT_PUBLIC_API_URL: /api

  nginx:
    image: nginx:alpine
    container_name: applygrid-nginx

    restart: unless-stopped

    depends_on:
      - frontend
      - backend

    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: applygrid-cloudflared
    restart: unless-stopped

    env_file:
      - ./.env.cloudflare

    command: tunnel --no-autoupdate run

    depends_on:
      - nginx
